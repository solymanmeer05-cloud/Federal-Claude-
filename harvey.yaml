channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | microsoft | smtp | instantly
    max_daily_sends: 40
    require_approval: true      # native: review in Outbox; Instantly: sending held
    # link_domains: ["mainsite.com"]   # your own sites besides the sending
    #                                  # domain and booking link; on autopilot,
    #                                  # an email linking elsewhere waits for you
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
    # New sending domain? Set start_date to the day your warmup service went
    # on: no cold email for min_days, then the cold cap climbs from
    # start_sends by daily_increase a day up to max_daily_sends. Replies are
    # never held. Gmail/Microsoft/SMTP only (Instantly has its own warmup).
    # Check readiness any time with `harvey warmup`.
    # We recommend TrulyInbox for warmup: https://trulyinbox.com/?via=harvey
    # Connect it (`harvey trulyinbox connect`) and `harvey warmup` reads
    # whether this mailbox is actually warmed.
    warmup:
      start_date: ""            # YYYY-MM-DD; blank = no ramp
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""         # only if your provider uses an unusual one
    # Send cold email only in office hours in each recipient's own time zone,
    # worked out from the company's location or the country Precleared finds.
    # Anyone Harvey can't place gets the window in usage.quiet_hours.timezone.
    # Follow-ups move into the window; replies are never held. Quiet hours
    # then stop prospecting and writing, not mail that's due.
    # Gmail/Microsoft/SMTP only. Remove the # marks to switch it on.
    send_window:
      start: "09:00"
      end: "16:30"
      weekdays_only: true
      recipient_timezone: true
  linkedin:
    enabled: false             # explicit opt-in; credentials alone do not enable it
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "Europe/London"

# Optional: check each new recipient with Precleared (precleared.dev) before
# the first cold email: may cold marketing email go to this address under UK
# PECR, US CAN-SPAM, Canada's CASL, Germany's UWG and France's rules? Any other
# answer holds the email back, with the reason in the Outbox. One check per
# address; 10 a day free without a key, 25 with a free key (PRECLEARED_API_KEY
# in .env). Applies to the native providers (gmail, microsoft, smtp). If all
# your prospects are in one country, set prospect_country: Precleared uses it
# only when it can't tell the country from the address, company records or the
# company's website.
compliance:
  # Added under every cold email (never replies). For a UK limited company or
  # charity, include the registered name, number and registered office here.
  postal_address: ""
  # Keep wording Harvey recognises as an opt-out ("no thanks", "unsubscribe").
  opt_out_line: 'If this isn''t relevant to you, reply "no thanks" and I won''t email again.'
  # Never email these, cold or in reply: competitors, your existing customers,
  # anyone under a legal hold. An entry is an address or a domain, and a domain
  # covers its subdomains ("acme.example" also blocks "mail.acme.example", but
  # not "notacme.example"). Checked by the gate at send time, so it holds even
  # for an email you already approved in the Outbox, and picked up by a running
  # Harvey at once. If you trained Harvey, set it in harvey.local.yaml instead:
  # that file wins.
  do_not_contact: []
  #   - "competitor.example"
  #   - "jane@acme.example"
  precleared:
    enabled: false
    sender_country: ""          # GB or US: where your business is based
    address_source: "unknown"   # published | bought | scraped | given | unknown
    prospect_country: ""        # optional, e.g. US if all your prospects are in one country
    # Harvey also tells Precleared the recipient's country when the company's
    # location makes it certain, and the company's and person's names when
    # it has them (see docs/precleared.md).
